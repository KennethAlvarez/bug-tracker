name: CI

on: 
    push:
        branches:
            - main
    workflow_dispatch:

jobs: 
    unit-tests-backend:
        runs-on: ubuntu-latest
        steps: 
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with: 
                go-version: "1.21"
                cache-dependency-path: bugtracker-backend/go.sum

            - name: Install go-junit-report
              run: |
                go install github.com/jstemmer/go-junit-report/v2@latest


            - name: Execute backend tests
              working-directory: ./bugtracker-backend
              run: |
                go test -v ./... 2>&1 | go-junit-report > test-results.xml
            
         


    unit-tests-frontend:
        needs: unit-tests-backend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:  
                node-version: "20"
                cache: "npm"
                cache-dependency-path: bugtracker-frontend/package-lock.json

            - name: Execute frontend test cases
              working-directory: ./bugtracker-frontend
              run: |
                npm ci
                npm test    
            - name: Frontend Reports
              uses: dorny/test-reporter@v1
              if: always()
              with:
                name: Frontend unit tests report
                path: bugtracker-frontend/test-results.xml
                reporter: jest-junit
                
    api-tests:
      needs: unit-tests-backend
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Launch app
          run: |
            docker compose up --build -d
            npm ci
            npx wait-port http://localhost:8080/api/health -t 30000
        
        - name: Run API tests Playwright
          working-directory: ./tests-api
          run: |
            npx playwright test
    
    testing-e2e:
      runs-on: ubuntu-latest

      steps:
        
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:  
            node-version: "20"
            cache: "npm"
            cache-dependency-path: tests-e2e/tsconfig.json


        - name: Install dependencies
          run: npm ci

        - name: Run tests
          working-directory: ./tests-e2e
          run: |
            npx playwright test
      
        





