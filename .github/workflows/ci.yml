name: CI

on: 
    push:
        branches:
            - main
    workflow_dispatch:

jobs: 
    unit-tests-backend:
        runs-on: ubuntu-latest
        steps: 
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with: 
                go-version: "1.21"
                cache-dependency-path: bugtracker-backend/go.sum

            - name: Install go-junit-report
              run: go installl github.com/jstemer/go-junit-report/v2@latest


            - name: Execute backend tests
              working-directory: ./bugtracker-backend
              run: |
                go test -v ./... 2>&1 | go-junit-report > test-results.xml
            
            - name: Publish backend test results
              uses: dorny/test-reporter@v1
              if: always()
              with:
                name: Backend unit tests report
                path: bugtracker-backend/test-results.xml
                reporter: jest-latest
                


    unit-tests-frontend:
        needs: unit-tests-backend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:  
                node-version: "20"
                cache: "npm"
                cache-dependency-path: bugtracker-frontend/package-lock.json

            - name: Execute frontend test cases
              working-directory: ./bugtracker-frontend
              run: |
                npm ci
                npm test    
            - name: Frontend Reports
              uses: dorny/test-reporter@v1
              if: always()
              with:
                name: Frontend unit tests report
                path: bugtracker-frontend/test-results.xml
                reporter: jest-junit

            